version: 2
updates:
  # Actions used by the CI, docs and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # chore() is hidden in release-please-config.json, so bumps stay out of the
      # changelog and do not cut a release. Use "deps" instead if you would rather
      # they appeared there.
      prefix: "chore(deps)"

  # Python deps declared in pyproject.toml / requirements-dev.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
